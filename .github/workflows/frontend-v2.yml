name: Frontend V2 foundation
on:
  workflow_dispatch:
  push:
    paths: ['.gitattributes', 'apps/**', 'packages/**', 'nioh3_scroll_editor/**', 'tests/**', 'test_fixtures/**', 'research/analyze_live_item_insertion.py', 'tools/audit_v2_localization.py', 'tools/export_v2_ui_locales.py', 'tools/audit_v2_ui_locales.mjs', 'tools/verify_native_faults.ps1', 'research/verify_native_fault_matrix.py', 'research/native_dispatch_fixture.cpp', 'packaging/**', 'tools/*frontend_v2*', 'tools/write_v2_python_manifest.py', 'launch_*worker.py', 'package*.json', 'tsconfig.json', 'requirements*.txt', '.github/workflows/frontend-v2.yml']
  pull_request:
    paths: ['.gitattributes', 'apps/**', 'packages/**', 'nioh3_scroll_editor/**', 'tests/**', 'test_fixtures/**', 'research/analyze_live_item_insertion.py', 'tools/audit_v2_localization.py', 'tools/export_v2_ui_locales.py', 'tools/audit_v2_ui_locales.mjs', 'tools/verify_native_faults.ps1', 'research/verify_native_fault_matrix.py', 'research/native_dispatch_fixture.cpp', 'packaging/**', 'tools/*frontend_v2*', 'tools/write_v2_python_manifest.py', 'launch_*worker.py', 'package*.json', 'tsconfig.json', 'requirements*.txt', '.github/workflows/frontend-v2.yml']
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r packaging/requirements-v2.lock.txt
      - run: npm ci --no-fund
      - run: python tools/verify_native_build_manifest.py
      - run: npm run contracts
      - run: python tools/export_v2_ui_locales.py
      - run: git diff --exit-code -- apps/workshop/ui-locales.json
      - run: node tools/audit_v2_ui_locales.mjs
      - run: git diff --exit-code -- packages/contracts
      - run: python -m unittest tests.test_frontend_v2 tests.test_v2_operations tests.test_v2_localization tests.test_auxiliary_catalog tests.test_recommended_level tests.test_v2_recommended_level tests.test_live_insertion_evidence tests.test_v2_live_reveal tests.test_live_add_operations tests.test_live_add_application tests.test_live_add_descriptor tests.test_single_native_insertion tests.test_dispatch_probe_evidence tests.test_live_add_native tests.test_cart_batch tests.test_review_integration tests.test_grace_accelerated_scanner tests.test_r4_batch_wrapper -v
      - run: python tools/audit_v2_localization.py --output deliverables/frontend-v2/localization-coverage.json
      - run: npm test
      - run: python -m unittest tests.test_effect_occurrences tests.test_challenge_override tests.test_runtime_count_edit tests.test_challenge_completion_capture
      - run: ./tools/verify_native_faults.ps1
      # Packaged host acceptance belongs to the signed Tauri preparation workflow.
      - run: npm run typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-v2-evidence
          path: deliverables/frontend-v2/
