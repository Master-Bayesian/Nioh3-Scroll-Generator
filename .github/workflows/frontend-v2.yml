name: Frontend V2 foundation
on:
  workflow_dispatch:
  push:
    paths: ['.gitattributes', 'apps/**', 'packages/**', 'nioh3_scroll_editor/**', 'tests/**', 'test_fixtures/**', 'research/analyze_live_item_insertion.py', 'tools/audit_v2_localization.py', 'tools/export_v2_ui_locales.py', 'tools/audit_v2_ui_locales.mjs', 'tools/verify_native_faults.ps1', 'tools/ui-audit/**', 'research/verify_native_fault_matrix.py', 'research/native_dispatch_fixture.cpp', 'packaging/**', 'tools/*frontend_v2*', 'tools/write_v2_python_manifest.py', 'launch_*worker.py', 'package*.json', 'tsconfig.json', 'requirements*.txt', '.github/workflows/frontend-v2.yml']
  pull_request:
    paths: ['.gitattributes', 'apps/**', 'packages/**', 'nioh3_scroll_editor/**', 'tests/**', 'test_fixtures/**', 'research/analyze_live_item_insertion.py', 'tools/audit_v2_localization.py', 'tools/export_v2_ui_locales.py', 'tools/audit_v2_ui_locales.mjs', 'tools/verify_native_faults.ps1', 'tools/ui-audit/**', 'research/verify_native_fault_matrix.py', 'research/native_dispatch_fixture.cpp', 'packaging/**', 'tools/*frontend_v2*', 'tools/write_v2_python_manifest.py', 'launch_*worker.py', 'package*.json', 'tsconfig.json', 'requirements*.txt', '.github/workflows/frontend-v2.yml']
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r packaging/requirements-v2.lock.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --no-fund
      - run: npm run contracts
      - run: python tools/export_v2_ui_locales.py
      - run: git diff --exit-code -- apps/workshop/ui-locales.json
      - run: node tools/audit_v2_ui_locales.mjs
      - run: git diff --exit-code -- packages/contracts
      - run: python tools/audit_v2_localization.py --output deliverables/frontend-v2/localization-coverage.json
      - run: npm test
      - run: ./tools/verify_native_faults.ps1
      # Packaged host acceptance belongs to the signed Tauri preparation workflow.
      - run: npm run typecheck
      # Fixture-only UI checks: production components in Chromium over a scripted
      # bridge; no game, save or native host.
      - run: npx playwright install chromium
      - run: node apps/workshop/verify-live-equipment-add.mjs
      - run: node apps/workshop/verify-runtime-compatibility.mjs
      - run: node apps/workshop/verify-character-draft.mjs
      - run: node apps/workshop/verify-scroll-completion.mjs
      # Text must fit its box in every locale at the minimum window size.
      - run: node apps/workshop/verify-text-fit.mjs
      # Flows the text-fit check does not reach (dialogs, save management, a 1,500-item list).
      # One theme and the minimum window keep it short; run the full matrix by hand before a release.
      - run: node tools/ui-audit/verify-arc-expanded.mjs --out deliverables/frontend-v2/arc-expanded
        env: { NIOH3_UI_THEMES: light, NIOH3_UI_MATRIX: minimum }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-v2-evidence
          path: deliverables/frontend-v2/
