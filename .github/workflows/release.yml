name: Signed V2 Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      NIOH3_PARITY_ALLOW_CPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r packaging/requirements-v2.lock.txt
      - run: npm ci --no-fund
      - name: Verify release versions
        id: version
        shell: pwsh
        run: |
          $version = python -c "from nioh3_scroll_editor.version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nodeVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $nodeVersion) { throw 'Python and desktop versions differ' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          $channel = if ($version.Contains('-')) { 'beta' } else { 'stable' }
          "channel=$channel" >> $env:GITHUB_OUTPUT
      - run: npm run contracts
      - run: python tools/export_v2_ui_locales.py
      - run: git diff --exit-code -- packages/contracts apps/workshop/ui-locales.json
      - run: node tools/audit_v2_ui_locales.mjs
      - run: python tools/verify_native_build_manifest.py
      - run: python -m unittest discover -v
      - run: npm test
      - run: ./tools/verify_native_faults.ps1
      - name: Build complete portable application
        shell: pwsh
        run: |
          ./tools/build_frontend_v2.ps1 -Python (Get-Command python).Source -Output 'deliverables/release/portable'
      - name: Verify the actual release binaries
        shell: pwsh
        run: |
          $portable = Join-Path $PWD 'deliverables/release/portable'
          $env:NIOH3_WORKER_EXE = Join-Path $portable 'resources/worker/nioh3-search-worker.exe'
          $env:NIOH3_PROTECTED_WORKER_EXE = Join-Path $portable 'resources/worker/nioh3-protected-worker.exe'
          $env:NIOH3_PORTABLE_EXE = Join-Path $portable 'Nioh3ScrollEditorV2.exe'
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/workshop/verify-connected.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/workshop/verify-collections.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/workshop/verify-release-surfaces.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive only verified product files
        run: python tools/archive_frontend_v2.py deliverables/release/portable deliverables/release/Nioh3ScrollEditor-${{ steps.version.outputs.value }}-win-x64.zip
      - name: Sign V2 update manifest with the existing official key
        shell: pwsh
        env:
          NIOH3_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          npx tsx tools/build_v2_update_manifest.ts `
            "deliverables/release/Nioh3ScrollEditor-${{ steps.version.outputs.value }}-win-x64.zip" `
            "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.value }}/Nioh3ScrollEditor-${{ steps.version.outputs.value }}-win-x64.zip" `
            "${{ steps.version.outputs.value }}" "${{ steps.version.outputs.channel }}" `
            packaging/release-notes.md deliverables/release/v2-update.json
      - name: Record test inventory
        run: python tools/write_test_inventory.py --output deliverables/release/test-inventory.json
      - name: Retain preparation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nioh3-v2-release
          path: |
            deliverables/release/*.zip
            deliverables/release/*.sha256
            deliverables/release/v2-update.json
            deliverables/release/test-inventory.json
      - name: Publish only when the version tag is pushed
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            deliverables/release/*.zip
            deliverables/release/*.sha256
            deliverables/release/v2-update.json
            deliverables/release/test-inventory.json
