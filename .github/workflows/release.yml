name: Signed Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify release version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from nioh3_scroll_editor.version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $version"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Compile Python sources
        run: python -m compileall -q nioh3_scroll_editor launch_editor.py emaki_exchange.py nioh3_seed_math.py scroll_lab.py tools

      - name: Run test suite
        run: python -m unittest discover -v

      - name: Build single-file executable
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build packaging\Nioh3ScrollGenerator.spec

      - name: Build signed update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          python tools\build_update_manifest.py `
            --version "${{ steps.version.outputs.value }}" `
            --asset dist\Nioh3ScrollGenerator.exe `
            --asset-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Nioh3ScrollGenerator.exe" `
            --notes-file packaging\release-notes.md `
            --output dist\latest.json

      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            dist/Nioh3ScrollGenerator.exe
            dist/latest.json
