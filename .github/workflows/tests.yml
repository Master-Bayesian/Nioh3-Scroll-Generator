name: Tests

on:
  push:
    paths-ignore: ['docs/**', 'research/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'research/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-crates:
    # The crates the release ships: tests, clippy and rustfmt.
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust for domain migration
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Restore the Rust build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/nioh3-migration-build/cargo-target
          key: rust-crates-1.99.0-${{ hashFiles('crates/*/Cargo.lock', 'apps/tauri/src-tauri/Cargo.lock') }}
          restore-keys: rust-crates-1.99.0-

      - name: Test, lint and format the Rust crates
        shell: pwsh
        run: |
          $env:NIOH3_BUILD_ROOT = Join-Path $env:RUNNER_TEMP 'nioh3-migration-build'
          $env:CARGO_TARGET_DIR = Join-Path $env:NIOH3_BUILD_ROOT 'cargo-target'
          cargo fetch --locked --manifest-path crates/nioh3-data/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path crates/nioh3-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path crates/nioh3-save/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --manifest-path crates/nioh3-domain/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --manifest-path crates/nioh3-data/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --manifest-path crates/nioh3-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --manifest-path crates/nioh3-save/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --offline --all-targets --manifest-path crates/nioh3-domain/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path crates/nioh3-domain/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --offline --all-targets --manifest-path crates/nioh3-data/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path crates/nioh3-data/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --offline --all-targets --all-features --manifest-path crates/nioh3-worker/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The workshop's bundled data files must match what the tables produce.
          cargo run --locked --offline --features workshop-export --manifest-path crates/nioh3-worker/Cargo.toml --example export_workshop -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path crates/nioh3-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --offline --all-targets --manifest-path crates/nioh3-save/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path crates/nioh3-save/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path crates/nioh3-runtime/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --features test-helper --manifest-path crates/nioh3-runtime/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --offline --all-targets --features test-fake,test-helper --manifest-path crates/nioh3-runtime/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path crates/nioh3-runtime/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path crates/nioh3-protected/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --manifest-path crates/nioh3-protected/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --offline --all-targets --manifest-path crates/nioh3-protected/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path crates/nioh3-protected/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force apps/tauri/dist | Out-Null
          cargo fetch --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --manifest-path apps/tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --offline --all-targets --manifest-path apps/tauri/src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path apps/tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  model-and-lint:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Lint and typecheck the frontend
        shell: pwsh
        run: |
          npm ci --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the TLA+ models
        shell: pwsh
        run: ./tools/check_models.ps1

  rust-packaging:
    # The packaging scripts stage the worker crates and each staged role answers
    # a real handshake.
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the packaging script dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Verify native accelerator source and ABI identity
        run: python tools\verify_native_build_manifest.py

      - name: Set up Rust for the packaged workers
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Build and verify the packaged Rust graph
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'rust-packaging-cargo-target'
          cargo fetch --locked --manifest-path crates/nioh3-worker/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path crates/nioh3-protected/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --offline --manifest-path crates/nioh3-worker/Cargo.toml --bin nioh3-readonly-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --offline --manifest-path crates/nioh3-protected/Cargo.toml --bin nioh3-protected-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/run_python_tests.ps1 -Python (Get-Command python).Source -TestPath tools/tests -PytestArgument -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
