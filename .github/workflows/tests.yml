# All reference cases run; affected selection is an independently executed shadow.
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  merge_group:
    types:
    - checks_requested
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'
jobs:
  plan:
    runs-on: windows-latest
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      static: ${{ steps.plan.outputs.static }}
      build: ${{ steps.plan.outputs.build }}
      rust_tests: ${{ steps.plan.outputs.rust_tests }}
      rust_static: ${{ steps.plan.outputs.rust_static }}
      models: ${{ steps.plan.outputs.models }}
      comparison: ${{ steps.plan.outputs.comparison }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'false'
        browser: 'false'
    - name: Discover complete cases and balance historical durations
      shell: pwsh
      run: node tools/ci/plan.mjs --out "$env:NIOH3_CI_OUT/plan"
      id: plan
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
        if-no-files-found: error
  model-and-lint:
    name: Frontend static (${{ matrix.id }})
    needs:
    - plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.static) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'true'
        browser: 'false'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - name: Execute all assigned required cases
      shell: pwsh
      run: node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group $env:CI_GROUP --out "$env:NIOH3_CI_OUT/results/$env:CI_GROUP"
      env:
        CI_GROUP: ${{ matrix.id }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-${{ matrix.id }}
        path: ${{ env.NIOH3_CI_OUT }}/results/${{ matrix.id }}
        if-no-files-found: error
  formal-models:
    name: Formal models (${{ matrix.id }})
    needs:
    - plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.models) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'false'
        browser: 'false'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - name: Execute all assigned required cases
      shell: pwsh
      run: node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group $env:CI_GROUP --out "$env:NIOH3_CI_OUT/results/$env:CI_GROUP"
      env:
        CI_GROUP: ${{ matrix.id }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-${{ matrix.id }}
        path: ${{ env.NIOH3_CI_OUT }}/results/${{ matrix.id }}
        if-no-files-found: error
  rust-crates:
    name: Rust tests (${{ matrix.id }})
    needs:
    - plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust_tests) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'false'
        browser: 'false'
    - uses: ./.github/actions/ci-rust
      id: rust
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - name: Execute all assigned required cases
      shell: pwsh
      run: node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group $env:CI_GROUP --out "$env:NIOH3_CI_OUT/results/$env:CI_GROUP"
      env:
        CI_GROUP: ${{ matrix.id }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-${{ matrix.id }}
        path: |-
          ${{ env.NIOH3_CI_OUT }}/results/${{ matrix.id }}
          ${{ env.NIOH3_BUILD_ROOT }}/deliverables/hell-weapon-seed-search-20261116
          ${{ env.NIOH3_BUILD_ROOT }}/deliverables/codex-v083-missing-features-20260930/backend
        if-no-files-found: error
    - name: Publish compiler cache from one successful owner
      if: matrix.id == 'rust-tests-1' && steps.rust.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/nioh3-migration-build/cargo-target
        key: ${{ steps.rust.outputs.cache-key }}
  rust-static:
    name: Rust Clippy and format (${{ matrix.id }})
    needs:
    - plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust_static) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'false'
        browser: 'false'
    - uses: ./.github/actions/ci-rust
      id: rust
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - name: Execute all assigned required cases
      shell: pwsh
      run: node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group $env:CI_GROUP --out "$env:NIOH3_CI_OUT/results/$env:CI_GROUP"
      env:
        CI_GROUP: ${{ matrix.id }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-${{ matrix.id }}
        path: ${{ env.NIOH3_CI_OUT }}/results/${{ matrix.id }}
        if-no-files-found: error
  frontend-build:
    needs: plan
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'true'
        browser: 'false'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - name: Check generated inputs and build immutable frontend bundles
      shell: pwsh
      run: node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group build-1 --out "$env:NIOH3_CI_OUT/results/build-1"
    - name: Locate the verified bundle
      shell: pwsh
      run: |-
        $manifest=@(Get-ChildItem -LiteralPath "$env:NIOH3_CI_OUT/results/build-1" -Recurse -Filter workshop.json)
        if($manifest.Count -ne 1){throw "Expected one workshop bundle"}
        "path=$($manifest[0].DirectoryName)" >> $env:GITHUB_OUTPUT
      id: bundle
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-workshop-bundle-a${{ github.run_attempt }}
        path: ${{ steps.bundle.outputs.path }}
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-build-1
        path: ${{ env.NIOH3_CI_OUT }}/results/build-1
        if-no-files-found: error
  frontend-tests:
    name: Full frontend (${{ matrix.id }})
    needs:
    - plan
    - frontend-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.frontend) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'true'
        browser: 'true'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-workshop-bundle-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/bundle
    - name: Execute the complete frontend reference
      shell: pwsh
      run: |-
        $env:NIOH3_CI_WORKSHOP_BUNDLE="$env:NIOH3_CI_OUT/bundle/workshop.json"
        node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group $env:CI_GROUP --out "$env:NIOH3_CI_OUT/results/$env:CI_GROUP"
      env:
        CI_GROUP: ${{ matrix.id }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-${{ matrix.id }}
        path: ${{ env.NIOH3_CI_OUT }}/results/${{ matrix.id }}
        if-no-files-found: error
  shadow-plan:
    needs: plan
    runs-on: windows-latest
    outputs:
      shadow: ${{ steps.shadow.outputs.shadow }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'true'
        browser: 'false'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - name: Exercise actual planner runner and aggregate fault controls
      shell: pwsh
      run: node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group ci-1 --out "$env:NIOH3_CI_OUT/results/ci-1"
    - name: Record independent selection without pruning
      shell: pwsh
      run: node tools/ci/shadow.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --out "$env:NIOH3_CI_OUT/shadow"
      id: shadow
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-shadow-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/shadow
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-ci-1
        path: ${{ env.NIOH3_CI_OUT }}/results/ci-1
        if-no-files-found: error
  shadow:
    name: Shadow frontend (${{ matrix.id }})
    if: needs.plan.outputs.comparison == 'Shadow'
    needs:
    - plan
    - frontend-build
    - shadow-plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs['shadow-plan'].outputs.shadow) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'true'
        browser: 'true'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-shadow-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/shadow
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-workshop-bundle-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/bundle
    - name: Execute the selected shadow cases
      shell: pwsh
      run: |-
        $env:NIOH3_CI_WORKSHOP_BUNDLE="$env:NIOH3_CI_OUT/bundle/workshop.json"
        node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --shadow "$env:NIOH3_CI_OUT/shadow/shadow.json" --group $env:CI_GROUP --out "$env:NIOH3_CI_OUT/results/$env:CI_GROUP"
      env:
        CI_GROUP: ${{ matrix.id }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-${{ matrix.id }}
        path: ${{ env.NIOH3_CI_OUT }}/results/${{ matrix.id }}
        if-no-files-found: error
  rust-packaging:
    needs: plan
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'false'
        browser: 'false'
    - uses: ./.github/actions/ci-rust
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
    - name: Prepare the selected Python environment
      shell: pwsh
      run: |-
        python -m pip install --disable-pip-version-check -r tools/requirements.txt
        if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
        "NIOH3_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - name: Native provenance packaging selector and real broker lifecycles
      shell: pwsh
      run: node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group packaging-1 --out "$env:NIOH3_CI_OUT/results/packaging-1"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-packaging-1
        path: ${{ env.NIOH3_CI_OUT }}/results/packaging-1
        if-no-files-found: error
  frontend-native:
    needs: plan
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'true'
        browser: 'true'
    - uses: ./.github/actions/ci-rust
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - name: Preserve actual-worker roster and recovery UI acceptance
      shell: pwsh
      run: node tools/ci/run.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --group frontend-native-1 --out "$env:NIOH3_CI_OUT/results/frontend-native-1"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-result-a${{ github.run_attempt }}-frontend-native-1
        path: ${{ env.NIOH3_CI_OUT }}/results/frontend-native-1
        if-no-files-found: error
  ci-complete:
    if: always()
    needs:
    - plan
    - model-and-lint
    - formal-models
    - rust-crates
    - rust-static
    - frontend-build
    - frontend-tests
    - shadow-plan
    - shadow
    - rust-packaging
    - frontend-native
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: ./.github/actions/ci-node
      with:
        dependencies: 'false'
        browser: 'false'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: ci-result-a${{ github.run_attempt }}-*
        path: ${{ env.NIOH3_CI_OUT }}/reports
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-shadow-plan-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/shadow
      if: needs.plan.outputs.comparison == 'Shadow'
    - name: Require full coverage and exact-source shadow agreement
      shell: pwsh
      run: node tools/ci/gate.mjs --plan "$env:NIOH3_CI_OUT/plan/plan.json" --reports "$env:NIOH3_CI_OUT/reports" --shadow "$env:NIOH3_CI_OUT/shadow/shadow.json"
        --out "$env:NIOH3_CI_OUT/final"
      if: always()
      env:
        NIOH3_CI_JOB_RESULTS: ${{ toJSON(needs) }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ci-final-evidence-a${{ github.run_attempt }}
        path: ${{ env.NIOH3_CI_OUT }}/final
        if-no-files-found: error
