[package]
name = "path_runner"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "path_runner"
path = "src/main.rs"

[[bin]]
name = "pipeline_check"
path = "src/bin_pipeline_check.rs"

[[bin]]
name = "end_to_end"
path = "src/bin_end_to_end.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
