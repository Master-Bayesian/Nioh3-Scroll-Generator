[package]
name = "nioh3-onefile-launcher"
version = "0.7.3"
edition = "2021"
rust-version = "1.89"
build = "build.rs"

[[bin]]
name = "Nioh3Launcher"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
