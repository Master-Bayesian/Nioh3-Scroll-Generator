[workspace]

[package]
name = "nioh3-worker"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2021"
description = "Development-only read-only preview worker transport for the Nioh 3 backend migration"
publish = false
default-run = "nioh3-readonly-worker"

[lib]
name = "nioh3_worker"
path = "src/lib.rs"

[[bin]]
name = "nioh3-readonly-worker"
path = "src/main.rs"

[[example]]
name = "export_workshop"
required-features = ["workshop-export"]

[features]
# Rebuilds the workshop data files; their key order needs preserve_order.
workshop-export = ["serde_json/preserve_order"]

[dependencies]
nioh3-domain = { path = "../nioh3-domain" }
nioh3-data = { path = "../nioh3-data" }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
