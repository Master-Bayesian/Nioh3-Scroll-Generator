[workspace]

[package]
name = "nioh3-save"
version = "0.1.0"
edition = "2021"
description = "Bounded Nioh 3 user-save model: container codec, inventory, templates, guarded transactions"
publish = false

[lib]
name = "nioh3_save"
path = "src/lib.rs"

[dependencies]
nioh3-domain = { path = "../nioh3-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
